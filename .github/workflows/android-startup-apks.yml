name: Native Android startup APKs
on:
  push:
    paths:
      - '.github/workflows/android-startup-apks.yml'
      - 'tools/build-test-apks.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        renderer: [fb, gles]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip zip openjdk-17-jdk-headless libncurses5 libtinfo5 qemu-user
      - name: Build and verify native APK
        run: bash tools/build-test-apks.sh ${{ matrix.renderer }}
      - name: Preserve APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inferno-${{ matrix.renderer }}-armeabi-v7a-startup
          path: apk-output/
          if-no-files-found: warn
          retention-days: 14
