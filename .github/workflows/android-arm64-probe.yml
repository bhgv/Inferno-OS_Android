name: Android ARM64 framebuffer probe
on:
  push:
    paths:
      - '.github/workflows/android-arm64-probe.yml'
      - 'tools/build-arm64-probe.sh'
      - 'app/src/main/cpp/arm64-probe/**'
      - 'tests/arm64-probe*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install classic-mk and Bionic execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip zip qemu-user openjdk-17-jdk-headless
      - name: Build and verify real Android ARM64 probes
        run: bash tools/build-arm64-probe.sh
      - name: Preserve signed APKs and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Android-FB-arm64-probe
          path: apk-arm64-output/
          if-no-files-found: warn
          retention-days: 14
