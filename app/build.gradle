apply plugin: 'com.android.application'
def bundleInfernoRuntime = (project.findProperty('infernoBundleRuntime') ?: 'false').toBoolean()
android {
    compileSdkVersion 25

    defaultConfig {
        applicationId 'bhgv.vitanuova.inferno_os'
        minSdkVersion 14
        targetSdkVersion 17
        ndk.abiFilters(*((project.findProperty('infernoAbis') ?: 'armeabi-v7a').split(',')))

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_ARM_MODE=arm',
                        '-DINFERNO_BUNDLE_RUNTIME=' + (bundleInfernoRuntime ? 'ON' : 'OFF'),
                        '-DANDROID_TOOLCHAIN=clang',
                        '-DINFERNO_ROOT=' + (project.findProperty('infernoRoot') ?: rootProject.file('inferno-os').absolutePath),
                        '-DANDROID_STL=c++_static'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    productFlavors {
    }
}

dependencies {
}

// Provisioning is opt-in; execution always uses /sdcard/Inferno.
android.sourceSets.main.assets.srcDir "$buildDir/generated/infernoAssets"
task stageInfernoAssets(type: Exec) {
    onlyIf { bundleInfernoRuntime }
    commandLine 'python3', rootProject.file('tools/stage-inferno.py').absolutePath,
            '--source', (project.findProperty('infernoRoot') ?: rootProject.file('inferno-os').absolutePath),
            '--output', "$buildDir/generated/infernoAssets/inferno"
}
task clearInfernoAssets(type: Delete) {
    onlyIf { !bundleInfernoRuntime }
    delete "$buildDir/generated/infernoAssets"
}
preBuild.dependsOn stageInfernoAssets, clearInfernoAssets
