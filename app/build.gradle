apply plugin: 'com.android.application'
android {
    compileSdkVersion 25

    defaultConfig {
        applicationId 'bhgv.vitanuova.inferno_os'
        minSdkVersion 14
        targetSdkVersion 17
        ndk.abiFilters(*((project.findProperty('infernoAbis') ?: 'armeabi-v7a').split(',')))

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_ARM_MODE=arm',
                        '-DANDROID_TOOLCHAIN=clang',
                        '-DINFERNO_ROOT=' + (project.findProperty('infernoRoot') ?: rootProject.file('inferno-os').absolutePath),
                        '-DANDROID_STL=c++_static'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    productFlavors {
    }
}

dependencies {
}

// Stage filesystem data for native extraction; no application Java source is introduced.
android.sourceSets.main.assets.srcDir "$buildDir/generated/infernoAssets"
task stageInfernoAssets(type: Exec) {
    commandLine (project.findProperty('infernoPython') ?: 'python3'),
            rootProject.file('tools/stage-inferno.py').absolutePath,
            '--source', (project.findProperty('infernoRoot') ?: rootProject.file('inferno-os').absolutePath),
            '--output', "$buildDir/generated/infernoAssets/inferno"
}
preBuild.dependsOn stageInfernoAssets
